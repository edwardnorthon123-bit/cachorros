<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adopta un Cachorro 🐾</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #fdf6ec;
      --warm: #f4e4cc;
      --amber: #e8a84c;
      --brown: #7a4f2e;
      --dark: #3b2010;
      --green: #5a8a5a;
      --green-light: #d4edda;
      --grey: #c8c0b8;
      --grey-light: #f0ede8;
      --shadow: 0 8px 32px rgba(58,32,16,0.13);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--cream);
      font-family: 'Nunito', sans-serif;
      color: var(--dark);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 10%, #f9e4b760 0%, transparent 60%),
        radial-gradient(ellipse at 80% 90%, #e8c99340 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 20px 60px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 40px;
      animation: fadeDown 0.7s ease both;
    }

    .paws {
      font-size: 2rem;
      letter-spacing: 8px;
      margin-bottom: 10px;
      animation: wiggle 2s ease-in-out infinite;
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.2rem, 6vw, 3.6rem);
      color: var(--brown);
      line-height: 1.1;
      margin-bottom: 10px;
    }

    h1 span { color: var(--amber); }

    .subtitle {
      font-size: 1.1rem;
      color: var(--brown);
      opacity: 0.75;
      font-weight: 600;
      max-width: 420px;
      margin: 0 auto;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Counter bar */
    .counter-wrap {
      background: white;
      border-radius: 16px;
      padding: 14px 20px;
      margin-bottom: 24px;
      border: 2px solid var(--warm);
      box-shadow: var(--shadow);
      animation: fadeDown 0.7s 0.1s ease both;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .counter-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--brown);
    }

    .counter-bar {
      height: 8px;
      background: var(--warm);
      border-radius: 99px;
      overflow: hidden;
    }

    .counter-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--amber), var(--green));
      border-radius: 99px;
      transition: width 0.4s ease;
      width: 0%;
    }

    /* Photo */
    .photo-wrapper {
      position: relative;
      background: white;
      border-radius: 28px;
      box-shadow: var(--shadow), 0 2px 0 var(--amber);
      overflow: visible;
      margin-bottom: 40px;
      animation: fadeUp 0.7s 0.2s ease both;
      border: 3px solid var(--warm);
    }

    .photo-inner {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
    }

    .photo-inner img {
      width: 100%;
      display: block;
      border-radius: 24px;
    }

    /* Badges on photo */
    .badge {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--amber);
      color: white;
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid white;
      box-shadow: 0 3px 10px rgba(0,0,0,0.25);
      transition: transform 0.2s, background 0.2s;
      z-index: 10;
    }

    .badge.clickable { cursor: pointer; }
    .badge.clickable:hover { transform: scale(1.18); }

    .badge.selected { background: var(--green); }

    .badge.adopted {
      background: var(--grey);
      cursor: default;
      font-size: 1rem;
    }

    .badge.hovered { transform: scale(1.18); }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    .b1 { left: 5%;  top: 15%; }
    .b2 { left: 21%; top: 10%; }
    .b3 { left: 38%; top: 8%; }
    .b4 { left: 54%; top: 8%; }
    .b5 { left: 70%; top: 12%; }
    .b6 { right: 3%; top: 16%; }

    /* Selection panel */
    .selection-panel { animation: fadeUp 0.7s 0.4s ease both; }

    .selection-title {
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: var(--brown);
      margin-bottom: 20px;
    }

    .puppies-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }

    @media (max-width: 500px) {
      .puppies-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* Available card */
    .puppy-card {
      background: white;
      border-radius: 18px;
      padding: 16px 12px;
      text-align: center;
      border: 2.5px solid var(--warm);
      cursor: pointer;
      transition: all 0.22s ease;
      box-shadow: 0 2px 8px rgba(58,32,16,0.07);
      user-select: none;
      position: relative;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .puppy-card:hover {
      border-color: var(--amber);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(58,32,16,0.13);
    }

    .puppy-card.active {
      border-color: var(--green);
      background: var(--green-light);
    }

    .puppy-card.active .card-num { background: var(--green); }

    .puppy-card.active::after {
      content: '✓';
      position: absolute;
      top: 8px;
      right: 12px;
      color: var(--green);
      font-size: 1.1rem;
      font-weight: 900;
    }

    .puppy-card.hovered {
      border-color: var(--amber);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(58,32,16,0.13);
    }

    .card-num {
      width: 44px;
      height: 44px;
      background: var(--amber);
      color: white;
      border-radius: 50%;
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .card-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--brown);
    }

    /* Adopted card */
    .puppy-card.adopted {
      background: var(--grey-light);
      border-color: var(--grey);
      cursor: default;
      pointer-events: none;
    }

    .puppy-card.adopted:hover {
      transform: none;
      box-shadow: 0 2px 8px rgba(58,32,16,0.07);
    }

    .adopted-paw {
      font-size: 2rem;
      line-height: 1;
    }

    .adopted-label {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--grey);
    }

    /* Select all btn */
    .btn-select-all {
      display: block;
      width: 100%;
      background: transparent;
      border: 2px dashed var(--amber);
      border-radius: 12px;
      padding: 10px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--brown);
      cursor: pointer;
      margin-bottom: 24px;
      transition: all 0.2s;
    }

    .btn-select-all:hover {
      background: var(--warm);
      border-style: solid;
    }

    /* Message preview */
    .preview-box {
      background: white;
      border-radius: 16px;
      border: 2px solid var(--warm);
      padding: 16px 18px;
      margin-bottom: 20px;
      display: none;
    }

    .preview-box.visible { display: block; }

    .preview-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--brown);
      opacity: 0.6;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .preview-bubble {
      background: #dcf8c6;
      border-radius: 12px 12px 2px 12px;
      padding: 12px 16px;
      font-size: 0.93rem;
      color: #2b5a2b;
      font-weight: 600;
      line-height: 1.5;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    /* CTA */
    .cta-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .msg-box { width: 100%; max-width: 520px; }

    .msg-label {
      font-size: 0.82rem;
      color: var(--brown);
      opacity: 0.7;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .msg-box textarea {
      width: 100%;
      border-radius: 14px;
      border: 2px solid var(--warm);
      padding: 12px 16px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      color: var(--dark);
      resize: vertical;
      min-height: 70px;
      background: white;
      outline: none;
      transition: border-color 0.2s;
    }

    .msg-box textarea:focus { border-color: var(--amber); }

    .btn-adopt {
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 16px 40px;
      font-family: 'Nunito', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 24px rgba(37,211,102,0.35);
      transition: all 0.2s ease;
    }

    .btn-adopt:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 10px 30px rgba(37,211,102,0.45);
    }

    .btn-adopt:active { transform: scale(0.97); }

    .btn-adopt.disabled {
      opacity: 0.45;
      pointer-events: none;
    }

    footer {
      text-align: center;
      margin-top: 48px;
      font-size: 0.8rem;
      color: var(--brown);
      opacity: 0.5;
    }

    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>

  <script>
    // =============================================
    // CONFIGURACIÓN — solo editar aquí
    // =============================================
    const WHATSAPP_NUMBER = "5491100000000"; // ← Tu número con código de país

    const cachorros = {
      1: { disponible: true  },
      2: { disponible: true  },
      3: { disponible: true  },
      4: { disponible: true  },
      5: { disponible: true  },
      6: { disponible: true  },
    };
    // =============================================

    const selected = new Set();

    // Build grid
    function buildGrid() {
      const grid = document.getElementById('puppies-grid');
      grid.innerHTML = '';
      const total = Object.keys(cachorros).length;
      const availCount = Object.values(cachorros).filter(c => c.disponible).length;

      document.getElementById('counter-avail').textContent =
        availCount + ' de ' + total + ' disponibles';

      for (let n = 1; n <= total; n++) {
        const c = cachorros[n];
        const div = document.createElement('div');

        if (!c.disponible) {
          div.className = 'puppy-card adopted';
          div.id = 'card-' + n;
          div.innerHTML = `
            <div class="adopted-paw">🐾</div>
            <div class="adopted-label">¡Ya tiene hogar!</div>
          `;
          // Badge also adopted
          const badge = document.getElementById('badge-' + n);
          if (badge) {
            badge.classList.remove('clickable');
            badge.classList.add('adopted');
            badge.textContent = '🐾';
            badge.onclick = null;
            badge.onmouseenter = null;
            badge.onmouseleave = null;
          }
        } else {
          div.className = 'puppy-card';
          div.id = 'card-' + n;
          div.innerHTML = `
            <div class="card-num" id="num-${n}">${n}</div>
            <div class="card-label">Cachorro #${n}</div>
          `;
          div.onclick = () => toggleCard(n);
          div.onmouseenter = () => hoverCard(n, true);
          div.onmouseleave = () => hoverCard(n, false);
        }
        grid.appendChild(div);
      }
    }

    function toggleCard(n) {
      if (!cachorros[n].disponible) return;
      if (selected.has(n)) {
        selected.delete(n);
        document.getElementById('card-' + n).classList.remove('active');
        document.getElementById('badge-' + n).classList.remove('selected');
      } else {
        selected.add(n);
        document.getElementById('card-' + n).classList.add('active');
        const badge = document.getElementById('badge-' + n);
        badge.classList.add('selected');
        badge.style.animation = 'none';
        setTimeout(() => badge.style.animation = 'pulse 0.4s ease', 10);
      }
      updateUI();
    }

    function hoverCard(n, on) {
      if (!cachorros[n].disponible) return;
      const card = document.getElementById('card-' + n);
      const badge = document.getElementById('badge-' + n);
      if (on) {
        card.classList.add('hovered');
        badge.classList.add('hovered');
      } else {
        card.classList.remove('hovered');
        badge.classList.remove('hovered');
      }
    }

    function selectAll() {
      let anyAdded = false;
      for (const [n, c] of Object.entries(cachorros)) {
        const num = parseInt(n);
        if (c.disponible && !selected.has(num)) {
          selected.add(num);
          document.getElementById('card-' + n).classList.add('active');
          document.getElementById('badge-' + n).classList.add('selected');
          anyAdded = true;
        }
      }
      // If all already selected, deselect all
      if (!anyAdded) {
        selected.clear();
        for (const n of Object.keys(cachorros)) {
          document.getElementById('card-' + n)?.classList.remove('active');
          document.getElementById('badge-' + n)?.classList.remove('selected');
        }
      }
      updateUI();
    }

    function buildMessage() {
      const nums = Array.from(selected).sort();
      const list = nums.map(n => 'Cachorro #' + n).join(', ');
      const extra = document.getElementById('extra-msg').value.trim();
      let msg = '¡Hola! 🐾 Me interesa adoptar: ' + list + '.';
      if (extra) msg += ' ' + extra;
      msg += ' ¿Podemos coordinar?';
      return msg;
    }

    function updatePreview() {
      const box = document.getElementById('preview-box');
      const text = document.getElementById('preview-text');
      if (selected.size > 0) {
        box.classList.add('visible');
        text.textContent = buildMessage();
      } else {
        box.classList.remove('visible');
      }
    }

    function updateUI() {
      const btn = document.getElementById('btn-adopt');
      const fill = document.getElementById('counter-fill');
      const counterText = document.getElementById('counter-text');
      const availCount = Object.values(cachorros).filter(c => c.disponible).length;

      // Counter
      const pct = availCount > 0 ? (selected.size / availCount) * 100 : 0;
      fill.style.width = pct + '%';

      if (selected.size === 0) {
        counterText.textContent = 'Ningún cachorro seleccionado';
        btn.classList.add('disabled');
      } else {
        const plural = selected.size === 1 ? 'cachorro seleccionado' : 'cachorros seleccionados';
        counterText.textContent = selected.size + ' ' + plural;
        btn.classList.remove('disabled');
      }

      // Select all button text
      const allSelected = Array.from(Object.keys(cachorros))
        .filter(n => cachorros[n].disponible)
        .every(n => selected.has(parseInt(n)));
      document.getElementById('btn-all').textContent = allSelected
        ? '✕ Deseleccionar todos'
        : '🐾 Seleccionar todos los disponibles';

      updatePreview();
    }

    function goWhatsApp() {
      if (selected.size === 0) return;
      launchConfetti();
      const url = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(buildMessage());
      setTimeout(() => window.open(url, '_blank'), 600);
    }

    // Confetti
    function launchConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const colors = ['#e8a84c','#5a8a5a','#f4e4cc','#7a4f2e','#ffd700','#ff8c69'];
      const pieces = Array.from({length: 130}, () => ({
        x: Math.random() * canvas.width,
        y: -10 - Math.random() * 200,
        r: 4 + Math.random() * 7,
        color: colors[Math.floor(Math.random() * colors.length)],
        vx: (Math.random() - 0.5) * 4,
        vy: 2 + Math.random() * 4,
        angle: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.15
      }));
      let frame, t = 0;
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        t++;
        pieces.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.angle += p.spin;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r);
          ctx.restore();
        });
        if (t < 100) frame = requestAnimationFrame(draw);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      cancelAnimationFrame(frame);
      draw();
    }

    // Init
    buildGrid();
    updateUI();
  </script>
</body>
</html>
